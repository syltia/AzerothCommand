name: Package and Release Azeroth Command

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHANGELOG=$(awk -v version="$VERSION" '
            BEGIN { in_section=0; found=0 }
            /^## -=\[ Version/ {
              if (in_section) exit
              if ($0 ~ version) {
                in_section=1
                found=1
                next
              }
            }
            in_section && /^## -=\[ Version/ { exit }
            in_section { print }
            END { if (!found) print "No changelog entry found for version " version }
          ' CHANGELOG.md)
          {
            echo 'ENTRY<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create addon package
        run: |
          mkdir -p package/AzerothCommand
          mkdir -p package/AzerothAdmin_Models

          rsync -av --progress . package/AzerothCommand/ \
            --exclude .git \
            --exclude .github \
            --exclude .gitignore \
            --exclude .claude \
            --exclude Docs \
            --exclude _build \
            --exclude package \
            --exclude 'README.md' \
            --exclude 'CREDITS.md' \
            --exclude 'CUSTOM_CHANGES.md' \
            --exclude 'logo_raw.psd' \
            --exclude 'icon_raw.psd' \
            --exclude 'AA_char.jpg' \
            --exclude 'AA_gm.jpg' \
            --exclude 'AA_server.jpg' \
            --exclude 'logo.png'

          if [ -d "_build/AzerothAdmin_Models" ]; then
            cp -r _build/AzerothAdmin_Models/* package/AzerothAdmin_Models/
            echo "Included AzerothAdmin_Models companion addon"
          else
            echo "ERROR: _build/AzerothAdmin_Models not found"
            exit 1
          fi

          cd package
          zip -r ../AzerothCommand-${{ steps.get_version.outputs.VERSION }}.zip AzerothCommand/ AzerothAdmin_Models/
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: AzerothCommand-${{ steps.get_version.outputs.VERSION }}.zip
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.ENTRY }}

            ## Installation
            1. Download `AzerothCommand-${{ steps.get_version.outputs.VERSION }}.zip`
            2. Extract it into `World of Warcraft/Interface/AddOns/`
            3. The package contains:
               - `AzerothCommand` - main addon
               - `AzerothAdmin_Models` - LoadOnDemand GameObject model database

            Azeroth Command is client-side only and is designed for AzerothCore 3.3.5a.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
